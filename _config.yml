# Longhand's website settings.
# GitHub rebuilds the site a minute or two after this file changes.

title: Longhand
description: >-
  Longhand is a free writing app, a monthly almanac for writers, and an
  occasional essay on craft.
season: Autumn 2026

# Where readers write to us: letters, answers to the prompt, open calls.
email: longhandlit@gmail.com

# Once the Almanac has an email edition, put your Buttondown username here
# (buttondown.com) and a sign-up box appears on the front page.
newsletter_username: ""

# The site's address. The CNAME file next to this one tells GitHub Pages
# to serve the site at this domain.
url: "https://longhandlit.com"
baseurl: ""

collections:
  almanac:
    output: true
    permalink: /almanac/:name/
  essays:
    output: true
    permalink: /essays/:name/

defaults:
  - scope:
      path: ""
      type: almanac
    values:
      layout: almanac
  - scope:
      path: ""
      type: essays
    values:
      layout: essay
      author: Longhand

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
