{%- comment -%} One Almanac post in a list. Pass post=. {%- endcomment -%}
{%- assign p = include.post -%}
{%- assign kind = p.kind | default: "Note" -%}
<li class="post-item">
  <a href="{{ p.url | relative_url }}">
    <span class="post-item-meta"><span class="kind kind-{{ kind | slugify }}">{{ kind }}</span><time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%B %-d" }}</time></span>
    <span class="post-item-title">{{ p.title }}</span>
    <span class="post-item-summary">{{ p.summary | default: p.excerpt | strip_html | strip_newlines | truncatewords: 32 }}</span>
  </a>
</li>
