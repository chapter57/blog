{%- comment -%} A postmark for an Almanac issue. Pass number= and month= (a date). {%- endcomment -%}
{%- assign pm_id = "pm-" | append: include.number -%}
<svg class="ill ill-postmark" viewBox="0 0 120 120" role="img" aria-label="Almanac number {{ include.number }}, {{ include.month | date: '%B %Y' }}">
  <defs><path id="{{ pm_id }}" d="M 60 60 m -44 0 a 44 44 0 1 1 88 0 a 44 44 0 1 1 -88 0"/></defs>
  <circle class="pm-ring" cx="60" cy="60" r="56"/>
  <circle class="pm-ring pm-thin" cx="60" cy="60" r="34"/>
  <text class="pm-arc"><textPath href="#{{ pm_id }}" startOffset="0">THE LONGHAND ALMANAC · THE LONGHAND ALMANAC ·</textPath></text>
  <text class="pm-no" x="60" y="58" text-anchor="middle">No. {{ include.number }}</text>
  <text class="pm-date" x="60" y="74" text-anchor="middle">{{ include.month | date: "%b %Y" | upcase }}</text>
</svg>
